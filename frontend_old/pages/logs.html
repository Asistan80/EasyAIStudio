<div class="logs-page">



    <!-- Header -->

    <div class="logs-header">


        <div>

            <h2>

                📜 Sistem Logları

            </h2>


            <p>

                Uygulama hareketlerini ve hataları takip et

            </p>


        </div>



        <button

            class="btn"

            id="clear-logs">


            Temizle


        </button>



    </div>








    <!-- Filters -->


    <div class="logs-filter card">



        <select id="log-type">


            <option>

                Tümü

            </option>


            <option>

                Bilgi

            </option>


            <option>

                Uyarı

            </option>


            <option>

                Hata

            </option>


        </select>



    </div>








    <!-- Logs -->


    <div

        class="logs-container card"

        id="logs-list">



        <div class="empty-logs">

            Henüz kayıt yok

        </div>



    </div>






</div>
